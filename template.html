<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Calendário</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📅</text></svg>">
<style>
  /* Tokens seguindo a paleta validada (validate_palette.js, modos claro e escuro):
     verde #008300 · ciano #2a78d6/#3987e5 · rosa #d55181 — CVD ok nos dois temas. */
  :root {
    --plano: #f9f9f7; --superficie: #fcfcfb;
    --ink: #0b0b0b; --ink2: #52514e; --mudo: #898781;
    --linha: #e1e0d9; --borda: rgba(11,11,11,.10);
    --ev-verde: #008300; --ev-ciano: #2a78d6; --ev-rosa: #d55181;
    --bom: #0ca30c; --bom-texto: #006300;
    --aviso: #fab219; --aviso-texto: #7a5600;
    --sombra: 0 1px 2px rgba(11,11,11,.05), 0 8px 24px rgba(11,11,11,.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --plano: #0d0d0d; --superficie: #1a1a19;
      --ink: #ffffff; --ink2: #c3c2b7; --mudo: #898781;
      --linha: #2c2c2a; --borda: rgba(255,255,255,.10);
      --ev-ciano: #3987e5;
      --bom-texto: #0ca30c; --aviso-texto: #fab219;
      --sombra: none;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 26px 16px 60px; background: var(--plano); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 880px; margin: 0 auto; }

  h1 { font-size: 1.45rem; margin: 0; letter-spacing: -.015em; }
  .data-hoje { margin: 2px 0 0; color: var(--ink2); font-size: .92rem; }
  h2 { font-size: .75rem; text-transform: uppercase; letter-spacing: .09em;
       color: var(--mudo); font-weight: 700; margin: 28px 0 10px; }
  .card { background: var(--superficie); border: 1px solid var(--borda);
          border-radius: 14px; padding: 16px 18px; box-shadow: var(--sombra); }
  .muted { color: var(--mudo); font-size: .875rem; }
  .nota { color: var(--mudo); font-size: .8rem; margin-top: 2px; }

  /* ---- contadores: stat tiles com medidor rumo ao próximo marco ---- */
  .tiles { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(232px, 1fr)); }
  .tile { background: var(--superficie); border: 1px solid var(--borda); border-radius: 14px;
          padding: 16px 16px 14px; box-shadow: var(--sombra); }
  .tile h3 { margin: 0; font-size: .82rem; font-weight: 600; color: var(--ink2);
             display: flex; align-items: center; gap: 7px; }
  .tile .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--cor); flex: none; }
  .tile .valor { font-size: 2.6rem; font-weight: 650; line-height: 1.1; margin-top: 8px;
                 letter-spacing: -.02em; }
  .tile .valor span { font-size: 1rem; font-weight: 500; color: var(--ink2); letter-spacing: 0; }
  .tile .sub { color: var(--mudo); font-size: .8rem; margin-top: 2px; }
  .tile .vivo { font-size: .85rem; color: var(--ink2); margin-top: 8px;
                font-variant-numeric: tabular-nums; min-height: 1.3em; }
  .medidor { height: 8px; border-radius: 4px; margin-top: 10px; overflow: hidden;
             background: var(--linha);
             background: color-mix(in srgb, var(--cor) 15%, transparent); }
  .medidor .fill { height: 100%; width: 0; background: var(--cor);
                   border-radius: 0 4px 4px 0; transition: width .6s ease; }
  .tile .meta { display: flex; justify-content: space-between; gap: 8px;
                color: var(--mudo); font-size: .72rem; margin-top: 6px; }

  /* ---- hoje ---- */
  .momento + .momento { border-top: 1px solid var(--linha); margin-top: 12px; padding-top: 12px; }
  .m-rotulo { display: flex; gap: 7px; align-items: center; font-size: .74rem;
              text-transform: uppercase; letter-spacing: .07em; font-weight: 650;
              color: var(--mudo); margin-bottom: 8px; }
  .m-rotulo svg { width: 15px; height: 15px; }
  .itens { list-style: none; margin: 0; padding: 0; }
  .itens > li + li { margin-top: 9px; }
  .linha { display: flex; justify-content: space-between; gap: 4px 14px;
           align-items: baseline; flex-wrap: wrap; }
  .med { font-weight: 600; }
  .apres { color: var(--mudo); font-weight: 400; font-size: .85em; }
  .dose { color: var(--ink2); font-weight: 600; font-size: .9rem; white-space: nowrap; }

  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: .7rem;
          font-weight: 650; padding: 1px 8px; border-radius: 99px; margin-left: 7px;
          vertical-align: 1px; white-space: nowrap; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .chip.bom { color: var(--bom-texto); background: rgba(12,163,12,.12); }
  .chip.bom i { background: var(--bom); }
  .chip.aviso { color: var(--aviso-texto); background: rgba(250,178,25,.14); }
  .chip.aviso i { background: var(--aviso); }

  /* ---- próximas mudanças ---- */
  .prox { display: flex; gap: 13px; }
  .prox + .prox { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linha); }
  .data-bloco { flex: none; width: 46px; text-align: center; background: var(--plano);
                border: 1px solid var(--linha); border-radius: 10px; padding: 5px 0 6px;
                height: fit-content; }
  .data-bloco b { display: block; font-size: 1.15rem; line-height: 1.15; }
  .data-bloco span { font-size: .66rem; text-transform: uppercase; letter-spacing: .06em;
                     color: var(--mudo); }
  .prox-corpo { min-width: 0; }
  .rel { font-size: .7rem; font-weight: 700; color: var(--mudo); text-transform: uppercase;
         letter-spacing: .06em; margin: 1px 0 3px; }
  .prox-corpo ul { list-style: none; margin: 0; padding: 0; }
  .prox-corpo li + li { margin-top: 6px; }
  .prox-corpo .nota { margin-left: 15px; }

  .tdot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
          margin-right: 7px; background: var(--mudo); }
  .tdot.inicio { background: var(--bom); }
  .tdot.fim { background: var(--aviso); }
  .tdot.marco { background: var(--cor, var(--mudo)); }
  .det { color: var(--ink2); font-size: .875em; }

  /* ---- histórico: trilho com separadores de mês ---- */
  .mes { font-size: .7rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
         color: var(--mudo); margin: 18px 0 10px; }
  .mes:first-child { margin-top: 0; }
  .hist { position: relative; margin: 0; padding: 0 0 0 18px; list-style: none;
          border-left: 2px solid var(--linha); }
  .hist > li { position: relative; padding-bottom: 14px; }
  .hist > li:last-child { padding-bottom: 2px; }
  .hist > li::before { content: ""; position: absolute; left: -24px; top: 5px; width: 9px;
                       height: 9px; border-radius: 50%; background: var(--mudo);
                       border: 2px solid var(--superficie); }
  .hist > li.hoje::before { background: var(--bom); }
  .hist .quando { font-weight: 650; font-size: .88rem; }
  .hist .quando span { color: var(--mudo); font-weight: 400; margin-left: 6px; font-size: .8rem; }
  .subitens { list-style: none; margin: 4px 0 0; padding: 0; }
  .subitens > li { padding: 2px 0; }
  .subitens .nota { margin-left: 15px; }

  /* ---- pendências ---- */
  .avisos { background: rgba(250,178,25,.10); border-color: rgba(250,178,25,.35); margin-top: 16px; }
  .avisos h3 { margin: 0 0 8px; font-size: .92rem; color: var(--aviso-texto);
               display: flex; gap: 8px; align-items: center; }
  .avisos h3 svg { width: 16px; height: 16px; flex: none; }
  .avisos ol { margin: 0; padding-left: 20px; }
  .avisos li { margin-bottom: 4px; }

  /* Hoje + Próximas lado a lado quando há espaço; o Histórico sobe pra coluna
     esquerda (sob o Hoje) pra equilibrar as alturas. No celular, a ordem do DOM
     vale: Hoje → Próximas → Histórico. */
  .duplo { display: grid; gap: 0 22px; }
  @media (min-width: 780px) {
    .duplo { grid-template-columns: 1fr 1fr; align-items: start;
             grid-template-areas: "hoje prox" "hist prox"; }
    .s-hoje { grid-area: hoje; } .s-prox { grid-area: prox; } .s-hist { grid-area: hist; }
  }

  footer { margin-top: 38px; text-align: center; color: var(--mudo); font-size: .8rem; line-height: 1.7; }
  footer code { background: var(--superficie); border: 1px solid var(--linha);
                border-radius: 5px; padding: 1px 5px; font-size: .92em; }

  @media (prefers-reduced-motion: reduce) { .medidor .fill { transition: none; } }
  @media print {
    :root { --plano: #fff; --superficie: #fff; --ink: #000; --ink2: #444;
            --mudo: #666; --linha: #ddd; --borda: #ccc; --sombra: none; }
    body { padding: 0; }
    .tile, .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Calendário</h1>
    <p class="data-hoje" id="hoje"></p>
  </header>

  <div id="pendencias"></div>

  <section>
    <h2>Contagem</h2>
    <div class="tiles" id="contadores"></div>
  </section>

  <div class="duplo">
    <section class="s-hoje">
      <h2>Hoje</h2>
      <div class="card" id="hojeMed"></div>
    </section>
    <section class="s-prox">
      <h2>Próximas mudanças</h2>
      <div class="card" id="proximas"></div>
    </section>
    <section class="s-hist">
      <h2>Histórico</h2>
      <div class="card" id="historico"></div>
    </section>
  </div>

  <footer>Recalculado na hora em que a página abre — não envelhece.<br>
    Para mudar remédio, dose ou evento: edite o <code>dados.json</code> e rode <code>node gerar.mjs</code>.</footer>
</div>

<script>
const DADOS = /*DADOS*/{}/*FIM*/;

// ---- datas (tudo em horário local; nada de UTC pra não errar o dia) ----
const isoDe = (d) => [d.getFullYear(), d.getMonth() + 1, d.getDate()]
  .map((n, i) => (i ? String(n).padStart(2, '0') : n)).join('-');
const hoje = new Date();
const hojeISO = isoDe(hoje);

const diaDe = (iso) => { const [a, m, d] = iso.slice(0, 10).split('-').map(Number); return new Date(a, m - 1, d); };
const DIA_MS = 86400000;
const diasEntre = (a, b) => Math.round((diaDe(b) - diaDe(a)) / DIA_MS);
const fmtData = (iso) => diaDe(iso).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
const fmtLongo = (iso) => diaDe(iso).toLocaleDateString('pt-BR', { day: 'numeric', month: 'long' });
const mesCurto = (iso) => diaDe(iso).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

// Instante local a partir de "AAAA-MM-DD" ou "AAAA-MM-DDThh:mm". Construído por
// componentes de propósito: new Date("AAAA-MM-DD") leria como UTC e adiantaria o
// contador algumas horas; assim, com ou sem hora, o horário é sempre o local.
const instante = (s) => {
  const [f, h = ''] = String(s).split('T');
  const [a, m, d] = f.split('-').map(Number);
  const [hh = 0, mn = 0, sg = 0] = h.split(':').map(Number);
  return new Date(a, (m || 1) - 1, d || 1, hh, mn, sg);
};

// O dado é texto de saúde escrito à mão. Escapar antes do innerHTML: um "<" numa
// nota ("PA < 12/8", "FC < 60") ou um "&" quebrariam a renderização da página.
const esc = (s) => String(s).replace(/[&<>"]/g,
  (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.getElementById('hoje').textContent =
  cap(hoje.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }));

// Cor identitária de cada evento (definida no dados.json, validada p/ claro+escuro).
const CORES = { verde: 'var(--ev-verde)', ciano: 'var(--ev-ciano)', rosa: 'var(--ev-rosa)', roxo: 'var(--ev-rosa)' };
const corDe = (nome) => CORES[nome] || 'var(--ev-ciano)';

// Ícones inline (sem internet): momentos do dia e alerta.
const ICO = {
  'manhã': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`,
  'tarde': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="14" r="4"/><path d="M12 6V4M6.3 8.3 4.9 6.9M17.7 8.3l1.4-1.4M3 14h1M20 14h1M3 20h18"/></svg>`,
  'jantar': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v7c0 1.1.9 2 2 2h3a2 2 0 0 0 2-2V2M7.5 2v20"/><path d="M20 15V2a5 5 0 0 0-4 4.9V13c0 1.1.9 2 2 2h2Zm0 0v7"/></svg>`,
  'noite': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>`,
  'sem horário': `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>`,
  alerta: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2.5 19.5a1 1 0 0 0 .9 1.5h17.2a1 1 0 0 0 .9-1.5L12 3Z"/><path d="M12 9v5M12 17.5v.01"/></svg>`,
};

// ---- contagem: dias como número-herói + medidor rumo ao próximo marco ----
const MARCOS = [7, 14, 21, 30, 60, 90, 120, 180, 270, 365, 548, 730];
function marcoDe(dias) {
  const prox = MARCOS.find((m) => m > dias);
  if (!prox) return null;
  const prev = MARCOS.filter((m) => m <= dias).pop() || 0;
  return { prox, faltam: prox - dias, frac: (dias - prev) / (prox - prev) };
}

function pintarContadores() {
  const agora = new Date();
  const alvo = document.getElementById('contadores');
  const evs = DADOS.eventos || [];
  if (!evs.length) { alvo.innerHTML = '<p class="muted">Nenhum evento registrado.</p>'; return; }
  alvo.innerHTML = evs.map((ev, i) => {
    const dias = Math.floor(Math.max(0, agora - instante(ev.inicio)) / DIA_MS);
    const sem = Math.floor(dias / 7); const resto = dias % 7;
    const semTxt = sem >= 1
      ? ` · ${plural(sem, 'semana', 'semanas')}${resto ? ` e ${plural(resto, 'dia', 'dias')}` : ''}` : '';
    const m = marcoDe(dias);
    return `<article class="tile" style="--cor:${corDe(ev.cor)}">
      <h3><span class="ponto"></span>${esc(ev.nome)}</h3>
      <div class="valor">${dias}<span> ${dias === 1 ? 'dia' : 'dias'}</span></div>
      <div class="sub">desde ${fmtLongo(ev.inicio)}${semTxt}</div>
      <div class="vivo" data-vivo="${i}">&nbsp;</div>
      ${m ? `<div class="medidor"><div class="fill" data-w="${(m.frac * 100).toFixed(1)}%"></div></div>
      <div class="meta"><span>rumo a ${m.prox} dias</span><span>${m.faltam === 1 ? 'falta 1' : `faltam ${m.faltam}`}</span></div>`
    : `<div class="meta"><span>acima de ${MARCOS[MARCOS.length - 1]} dias — marco máximo vencido</span></div>`}
      ${ev.obs ? `<div class="nota">${esc(ev.obs)}</div>` : ''}
    </article>`;
  }).join('');
  requestAnimationFrame(() => alvo.querySelectorAll('.medidor .fill')
    .forEach((f) => { f.style.width = f.dataset.w; }));
}

// A cada segundo: horas/min/seg ao vivo; na virada do dia, recarrega tudo.
function tique() {
  const agora = new Date();
  if (isoDe(agora) !== hojeISO) { location.reload(); return; }
  document.querySelectorAll('[data-vivo]').forEach((el) => {
    const ev = (DADOS.eventos || [])[Number(el.getAttribute('data-vivo'))];
    if (!ev) return;
    const ms = Math.max(0, agora - instante(ev.inicio));
    const h = Math.floor(ms / 3600000) % 24;
    const mnt = Math.floor(ms / 60000) % 60;
    const s = Math.floor(ms / 1000) % 60;
    el.textContent = `e ${h} h ${String(mnt).padStart(2, '0')} min ${String(s).padStart(2, '0')} s`;
  });
}

// ---- o que vale HOJE ----
const ativoEm = (p, iso) => p.de <= iso && (!p.ate || p.ate >= iso);
const nomeCompleto = (m) => m.nome + (m.apresentacao ? ` ${m.apresentacao}` : '');

function pintarHoje() {
  const porMomento = new Map();
  for (const m of DADOS.medicamentos || []) {
    for (const p of m.periodos || []) {
      if (!ativoEm(p, hojeISO)) continue;
      const k = p.momento || 'sem horário';
      if (!porMomento.has(k)) porMomento.set(k, []);
      porMomento.get(k).push({ m, p });
    }
  }
  const ordem = ['manhã', 'tarde', 'jantar', 'noite'];
  const chaves = [...porMomento.keys()].sort((a, b) => {
    const ia = ordem.indexOf(a); const ib = ordem.indexOf(b);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });

  const alvo = document.getElementById('hojeMed');
  if (!chaves.length) { alvo.innerHTML = '<p class="muted">Nenhum medicamento ativo hoje.</p>'; return; }

  alvo.innerHTML = chaves.map((k) => `
    <div class="momento">
      <div class="m-rotulo">${ICO[k] || ICO['sem horário']}<span>${esc(k)}</span></div>
      <ul class="itens">${porMomento.get(k).map(({ m, p }) => `
        <li>
          <div class="linha">
            <span class="med">${esc(m.nome)}${m.apresentacao ? ` <span class="apres">${esc(m.apresentacao)}</span>` : ''}${
              p.de === hojeISO ? '<span class="chip bom"><i></i>começa hoje</span>' : ''}${
              p.ate === hojeISO ? '<span class="chip aviso"><i></i>último dia</span>' : ''}</span>
            <span class="dose">${esc(p.dose)}</span>
          </div>
          ${p.nota ? `<div class="nota">${esc(p.nota)}</div>` : ''}
        </li>`).join('')}
      </ul>
    </div>`).join('');
}

// ---- mudanças: começo e fim de cada período viram eventos na linha do tempo ----
const PESO = { marco: 0, fim: 1, inicio: 2 };
function mudancas() {
  const evs = [];
  for (const m of DADOS.medicamentos || []) {
    for (const p of m.periodos || []) {
      const base = { nome: nomeCompleto(m), detalhe: `${p.dose}${p.momento ? ` · ${p.momento}` : ''}`, cor: null };
      evs.push({ data: p.de, tipo: 'inicio', ...base, nota: p.nota || null });
      if (p.ate) evs.push({ data: p.ate, tipo: 'fim', ...base, nota: null });
    }
  }
  for (const ev of DADOS.eventos || []) {
    evs.push({ data: ev.inicio.slice(0, 10), tipo: 'marco', nome: ev.nome, detalhe: null, nota: null, cor: ev.cor || null });
  }
  return evs.sort((a, b) => a.data.localeCompare(b.data) || PESO[a.tipo] - PESO[b.tipo]);
}

function agruparPorData(lista) {
  const g = new Map();
  for (const e of lista) { if (!g.has(e.data)) g.set(e.data, []); g.get(e.data).push(e); }
  return [...g.entries()];
}

function itemMudanca(e, futuro) {
  const verbo = e.tipo === 'fim' ? 'último dia de'
    : e.tipo === 'inicio' ? (futuro ? 'começa' : 'começou') : '';
  const dot = `<i class="tdot ${e.tipo}"${e.cor ? ` style="--cor:${corDe(e.cor)}"` : ''}></i>`;
  return `<li>${dot}${verbo ? `${verbo} ` : ''}<b>${esc(e.nome)}</b>${
    e.detalhe ? ` <span class="det">· ${esc(e.detalhe)}</span>` : ''}${
    e.nota ? `<div class="nota">${esc(e.nota)}</div>` : ''}</li>`;
}

function pintarProximas() {
  const grupos = agruparPorData(mudancas().filter((e) => e.data >= hojeISO));
  const alvo = document.getElementById('proximas');
  if (!grupos.length) {
    alvo.innerHTML = '<p class="muted">Nada agendado à frente. Quando a próxima troca for definida, ela aparece aqui.</p>';
    return;
  }
  alvo.innerHTML = grupos.map(([data, itens]) => {
    const d = diasEntre(hojeISO, data);
    const rel = d === 0 ? 'hoje' : d === 1 ? 'amanhã' : `em ${plural(d, 'dia', 'dias')}`;
    return `<div class="prox">
      <div class="data-bloco"><b>${diaDe(data).getDate()}</b><span>${mesCurto(data)}</span></div>
      <div class="prox-corpo">
        <div class="rel">${rel}</div>
        <ul>${itens.map((e) => itemMudanca(e, true)).join('')}</ul>
      </div>
    </div>`;
  }).join('');
}

function pintarHistorico() {
  const passadas = mudancas().filter((e) => e.data <= hojeISO);
  const alvo = document.getElementById('historico');
  if (!passadas.length) { alvo.innerHTML = '<p class="muted">Nada registrado ainda.</p>'; return; }
  const grupos = agruparPorData(passadas).reverse();
  let html = ''; let mesAtual = ''; let aberto = false;
  for (const [data, itens] of grupos) {
    const mes = cap(diaDe(data).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
    if (mes !== mesAtual) {
      if (aberto) html += '</ul>';
      html += `<div class="mes">${mes}</div><ul class="hist">`;
      mesAtual = mes; aberto = true;
    }
    const d = diasEntre(data, hojeISO);
    const rel = d === 0 ? 'hoje' : d === 1 ? 'ontem' : `há ${plural(d, 'dia', 'dias')}`;
    html += `<li${d === 0 ? ' class="hoje"' : ''}>
      <div class="quando">${fmtData(data)}<span>${rel}</span></div>
      <ul class="subitens">${itens.map((e) => itemMudanca(e, false)).join('')}</ul>
    </li>`;
  }
  if (aberto) html += '</ul>';
  alvo.innerHTML = html;
}

function pintarPendencias() {
  const itens = DADOS.confirmar || [];
  if (!itens.length) return;
  document.getElementById('pendencias').innerHTML = `
    <div class="card avisos" role="alert">
      <h3>${ICO.alerta}A confirmar — isto ainda não está definido; não invente, confirme antes</h3>
      <ol>${itens.map((t) => `<li>${esc(t)}</li>`).join('')}</ol>
    </div>`;
}

pintarContadores();
tique();
setInterval(tique, 1000);
pintarHoje();
pintarProximas();
pintarHistorico();
pintarPendencias();
</script>
